{% extends 'dimensionamento/base.html' %}

{% block content %}
<section class="dashboard-header">
    <h2>🪵 Catálogo de Madeiras</h2>
    <p>Propriedades mecânicas das espécies disponíveis no sistema, conforme a NBR 7190.</p>
</section>

{% comment %}
<div class="card" style="margin-bottom: 2rem; border-left: 4px solid #2563eb;">
    <h3>➕ Cadastrar Nova Espécie</h3>
    <form id="form-nova-madeira" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">
        
    <div style="grid-column: 1 / -1;">
        <label>Nome da Espécie (Ex: Pinus Taeda):</label><br>
        <input type="text" id="nome_madeira" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>

    <div>
        <label>Compressão f<sub>c0,k</sub> (MPa):</label><br>
        <input type="number" step="0.1" id="fc0k" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>
    <div>
        <label>Tração f<sub>t0,k</sub> (MPa):</label><br>
        <input type="number" step="0.1" id="ft0k" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>
    <div>
        <label>Cisalhamento f<sub>v0,k</sub> (MPa):</label><br>
        <input type="number" step="0.1" id="fv0k" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>
    <div>
        <label>Comp. Normal f<sub>c90,k</sub> (MPa):</label><br>
        <input type="number" step="0.1" id="fc90k" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>
    <div>
        <label>Módulo de Elast. E<sub>c0,m</sub> (MPa):</label><br>
        <input type="number" step="0.1" id="ec0m" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>
    <div>
        <label>Densidade &rho;<sub>ap</sub> (kg/m³):</label><br>
        <input type="number" step="0.1" id="densidade" class="form-input" style="width: 100%; padding: 0.5rem;" required>
    </div>

    <div style="grid-column: 1 / -1; margin-top: 0.5rem;">
        <button type="submit" class="btn btn-primary">Salvar no Banco de Dados</button>
    </div>
</form>
</div>
{% endcomment %}

<hr style="border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0;">

<section class="cards-grid" id="container-madeiras">
    <p>Carregando propriedades do banco de dados...</p>
</section>

<script>
    
    function carregarMadeiras() {
        fetch('/api/madeiras/')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('container-madeiras');
                container.innerHTML = ''; 

                if (data.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Nenhuma madeira cadastrada. Rode o script de povoamento (seed.py) para carregar os dados iniciais.</p>';
                    return;
                }

                data.forEach(madeira => {
                    const card = `
                        <div class="card">
                            <h3>${madeira.nome}</h3>
                            <p><strong>Resistência à Compressão Paralela($f_{c0,k}$):</strong> ${madeira.f_c0k} MPa</p>
                            <p><strong>Resistência à Tração ($f_{t0,k}$):</strong> ${madeira.f_t0k} MPa</p>
                            <p><strong>Resistência ao Cisalhamento ($f_{v0,k}$):</strong> ${madeira.f_v0k} MPa</p>
                            <p><strong>Resistência à Comp. Normal ($f_{c90,k}$):</strong> ${madeira.f_c90k} MPa</p>
                            <p><strong>Resitencia do modulo de Elasticidade ($E_{c0,m}$):</strong> ${madeira.e_c0m} MPa</p>
                            <p><strong>Resistência ao Embutimento ($E_{c0,m}$):</strong> ${madeira. f_fe} MPa</p>
                            <p><strong>Resitencia a Flexão ($E_{c0,m}$):</strong> ${madeira.f_fd} MPa</p>
                            
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => console.error('Erro ao buscar as madeiras:', error));
    }

    
    carregarMadeiras();

{% endblock %}
